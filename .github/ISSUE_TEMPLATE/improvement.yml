name: Improvement Proposal
description: Propose a code improvement or refactor you'd like to implement
title: "[Improvement]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Code Improvement Proposal
  - type: textarea
    id: description
    attributes:
      label: Current State
      description: What is the current state of the code and why does it need improvement?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Improvement
      description: How do you plan to improve it? What is your proposed solution?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ### Benchmarks & Context
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, benchmarks, or code snippets here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirm that I want to work on this improvement.
          required: true
        - label: I have searched the existing issues.
          required: true
