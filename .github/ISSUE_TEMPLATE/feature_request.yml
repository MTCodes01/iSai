name: Feature Proposal
description: Propose a new feature you'd like to build
title: "[Feature]: "
labels: ["feature", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Proposal
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you want to build.
    validations:
      required: true
  - type: textarea
    id: proposed_implementation
    attributes:
      label: Proposed Implementation
      description: How do you plan to build this feature? (Architecture, libraries, changes required)
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ### Supporting Information
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context or mockups/screenshots for your feature here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirm that I want to work on this feature.
          required: true
        - label: I have searched the existing issues for similar feature requests.
          required: true
        - label: I have read the `CONTRIBUTING.md` guidelines.
          required: true
