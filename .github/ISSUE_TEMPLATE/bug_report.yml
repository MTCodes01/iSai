name: Bug Fix Proposal
description: Propose a bug fix you'd like to work on
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Fix Proposal
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug you found...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: How do you plan to fix this bug?
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this bug to verify your fix?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ### Additional Details
        Any extra information you can provide (like operating system, browser, or environment) is highly appreciated.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirm that I want to work on this issue.
          required: true
        - label: I have searched the existing issues for similar bugs.
          required: true
        - label: I have read the `CONTRIBUTING.md` guidelines.
          required: true
